<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Checklist ตรวจรับกีตาร์ — Cort KX507MS</title>
<style>
  :root{
    --purple:#9A3FE0;
    --orange:#F0932B;
    --green:#4C9A6A;
    --bg:#120B1A;
    --surface:#1C1226;
    --surface2:#251731;
    --text:#F4EEFA;
    --muted:#A78FC4;
    --muted-dim:#7A628F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,sans-serif;
    padding:16px 0;
    min-height:100vh;
    overflow-x:hidden;
  }

  .container{
    max-width:420px;
    margin:0 auto;
    padding:0 16px;
  }

  /* Top bar */
  .topbar{
    position:sticky;top:0;z-index:10;
    background:linear-gradient(180deg, rgba(18,11,26,0.95) 0%, rgba(18,11,26,0.9) 100%);
    border-bottom:1px solid #3B2450;
    padding:16px;
    margin:-16px -16px 0 -16px;
    backdrop-filter:blur(8px);
  }
  .topbar h1{
    font-size:16px;
    font-weight:700;
    margin:0 0 2px;
    color:var(--purple);
  }
  .topbar .subtitle{
    font-size:12px;
    color:var(--muted-dim);
    margin-bottom:12px;
  }
  .progress-wrap{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .progress-track{
    flex:1;
    height:6px;
    background:var(--surface2);
    border-radius:3px;
    overflow:hidden;
    border:1px solid #3B2450;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--purple), var(--orange));
    width:0%;
    transition:width .3s ease;
  }
  .progress-count{
    font-size:12px;
    color:var(--orange);
    font-weight:700;
    white-space:nowrap;
  }

  .inspector-input{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:12px;
    font-size:12px;
  }
  .inspector-input label{
    color:var(--muted-dim);
    white-space:nowrap;
  }
  .inspector-input input{
    flex:1;
    background:var(--surface2);
    border:1px solid #3B2450;
    border-radius:6px;
    color:var(--text);
    padding:6px 10px;
    font-size:12px;
    font-family:inherit;
  }
  .inspector-input input::placeholder{
    color:var(--muted-dim);
  }
  .inspector-input input:focus{
    outline:none;
    border-color:var(--purple);
  }

  /* Section indicator */
  .section-badge{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    color:var(--bg);
    background:var(--purple);
    padding:2px 8px;
    border-radius:4px;
    margin-top:12px;
  }
  .section-badge.critical{
    background:var(--orange);
  }

  /* Swipe card container */
  .swipe-wrapper{
    position:relative;
    height:250px;
    margin:20px 0;
    background:var(--surface);
    border-radius:16px;
    border:1px solid #3B2450;
    overflow:hidden;
    user-select:none;
    cursor:grab;
  }
  .swipe-wrapper.grabbing{
    cursor:grabbing;
  }

  .swipe-card{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:24px;
    transition:all .3s ease;
    transform:translateX(0);
    will-change:transform;
  }

  .swipe-card.swiped-left{
    transform:translateX(-120%);
    opacity:0;
  }
  .swipe-card.swiped-right{
    transform:translateX(120%);
    opacity:0;
  }

  .swipe-wrapper::before{
    content:"";
    position:absolute;
    top:0;left:0;
    width:100%;height:100%;
    background:linear-gradient(90deg, rgba(76,154,106,0.15) 0%, transparent 50%, rgba(240,147,43,0.15) 100%);
    opacity:0;
    transition:opacity .15s ease;
    pointer-events:none;
  }
  .swipe-wrapper.swiping-left::before{ opacity:1; }
  .swipe-wrapper.swiping-right::before{ opacity:1; }

  .left-indicator, .right-indicator{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    font-size:32px;
    font-weight:700;
    opacity:0;
    transition:opacity .1s ease;
    z-index:1;
    pointer-events:none;
  }
  .left-indicator{
    left:20px;
    color:var(--green);
  }
  .right-indicator{
    right:20px;
    color:var(--orange);
  }
  .swipe-wrapper.swiping-left .left-indicator{ opacity:1; }
  .swipe-wrapper.swiping-right .right-indicator{ opacity:1; }

  .item-section{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin-bottom:6px;
  }
  .item-number{
    font-size:12px;
    color:var(--purple);
    font-weight:700;
    margin-bottom:8px;
  }
  .item-text{
    font-size:16px;
    line-height:1.5;
    margin-bottom:12px;
    flex:1;
  }
  .item-hint{
    font-size:11px;
    color:var(--muted-dim);
  }
  .item-bullets{
    margin:0 0 10px;
    padding-left:18px;
    font-size:12.5px;
    color:var(--muted);
    line-height:1.6;
  }
  .item-bullets li{ margin-bottom:2px; }

  /* Sub-checklist modal */
  .sub-check-list{
    text-align:left;
    margin:14px 0;
  }
  .sub-check-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    background:var(--surface2);
    border:1px solid #3B2450;
    border-radius:8px;
    margin-bottom:8px;
    cursor:pointer;
  }
  .sub-check-item input{
    width:18px;height:18px;
    accent-color:var(--orange);
    flex-shrink:0;
  }
  .sub-check-item span{
    font-size:13px;
  }

  /* Result modal */
  .modal-overlay{
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.7);
    backdrop-filter:blur(4px);
    z-index:100;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow-y:auto;
  }
  .modal-overlay.show{
    display:flex;
  }

  .result-card{
    background:var(--surface);
    border-radius:16px;
    border:2px solid;
    padding:24px;
    text-align:center;
    max-width:360px;
    width:100%;
    animation:slideUp .3s ease;
  }
  .result-card.pass{
    border-color:var(--green);
    box-shadow:0 0 20px rgba(76,154,106,0.2);
  }
  .result-card.fail{
    border-color:var(--orange);
    box-shadow:0 0 20px rgba(240,147,43,0.2);
  }

  .result-icon{
    font-size:40px;
    margin-bottom:12px;
  }
  .result-title{
    font-size:18px;
    font-weight:700;
    margin-bottom:8px;
  }
  .result-title.big-alert{
    font-size:28px;
    font-weight:900;
    color:var(--orange);
    margin-bottom:4px;
  }
  .result-desc{
    font-size:12px;
    color:var(--muted);
    line-height:1.6;
    margin-bottom:16px;
  }

  /* Comment section */
  .comment-section{
    text-align:left;
    margin:16px 0;
    padding:12px;
    background:var(--surface2);
    border-radius:8px;
  }
  .comment-label{
    font-size:11px;
    color:var(--muted);
    margin-bottom:6px;
    display:block;
  }
  .comment-textarea{
    width:100%;
    background:var(--bg);
    border:1px solid #3B2450;
    border-radius:6px;
    color:var(--text);
    padding:8px;
    font-size:12px;
    font-family:inherit;
    resize:none;
    min-height:60px;
  }
  .comment-textarea:focus{
    outline:none;
    border-color:var(--purple);
  }
  .comment-count{
    font-size:10px;
    color:var(--muted-dim);
    margin-top:4px;
    text-align:right;
  }

  .result-btn{
    width:100%;
    background:none;
    border:1.5px solid;
    padding:12px 20px;
    border-radius:8px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    transition:all .2s ease;
    font-family:inherit;
  }
  .result-card.pass .result-btn{
    color:var(--green);
    border-color:var(--green);
  }
  .result-card.pass .result-btn:hover{
    background:rgba(76,154,106,0.1);
  }
  .result-card.fail .result-btn{
    color:var(--orange);
    border-color:var(--orange);
  }
  .result-card.fail .result-btn:hover{
    background:rgba(240,147,43,0.1);
  }

  /* Deal-Breaker modal */
  .critical-list{
    background:rgba(240,147,43,0.1);
    border-left:3px solid var(--orange);
    border-radius:8px;
    padding:12px;
    margin:16px 0;
    text-align:left;
  }
  .critical-item{
    margin-bottom:10px;
    font-size:12px;
  }
  .critical-item:last-child{
    margin-bottom:0;
  }
  .critical-text{
    color:var(--orange);
    font-weight:700;
    margin-bottom:2px;
  }
  .critical-section{
    color:var(--muted-dim);
    font-size:11px;
  }

  .modal-buttons{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .modal-btn-continue{
    color:var(--purple);
    border-color:var(--purple);
  }
  .modal-btn-continue:hover{
    background:rgba(154,63,224,0.1);
  }
  .modal-btn-restart{
    color:var(--orange);
    border-color:var(--orange);
    background:rgba(240,147,43,0.1);
  }
  .modal-btn-restart:hover{
    background:rgba(240,147,43,0.2);
  }

  @keyframes slideUp{
    from{
      transform:translateY(20px);
      opacity:0;
    }
    to{
      transform:translateY(0);
      opacity:1;
    }
  }

  .footer{
    text-align:center;
    font-size:12px;
    color:var(--muted-dim);
    padding:32px 0;
  }
  .footer button{
    background:none;
    border:1px solid var(--muted-dim);
    color:var(--muted-dim);
    padding:6px 12px;
    border-radius:6px;
    font-size:11px;
    cursor:pointer;
    transition:all .2s ease;
  }
  .footer button:hover{
    border-color:var(--muted);
    color:var(--muted);
  }
</style>
</head>
<body>

<div class="container">

  <!-- Top bar -->
  <div class="topbar">
    <h1>Checklist ตรวจรับกีตาร์</h1>
    <div class="subtitle">Cort KX507MS Pale Moon · 7-String Multiscale</div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-count" id="progressCount">0/0</div>
    </div>
    <div class="inspector-input">
      <label for="inspectorName">ผู้ตรวจ:</label>
      <input type="text" id="inspectorName" placeholder="ชื่อ...">
    </div>
  </div>

  <div style="margin-top: 16px;">
    <div id="sectionBadge" class="section-badge"></div>

    <!-- Swipe card -->
    <div class="swipe-wrapper" id="swipeWrapper">
      <div class="left-indicator">✓</div>
      <div class="right-indicator">✗</div>
      
      <div class="swipe-card" id="swipeCard">
        <div class="item-section" id="itemSection"></div>
        <div class="item-number" id="itemNumber"></div>
        <div class="item-text" id="itemText"></div>
        <ul class="item-bullets" id="itemBullets"></ul>
        <div class="item-hint" id="itemHint"></div>
      </div>
    </div>

    <!-- Result modal -->
    <div class="modal-overlay" id="resultModal">
      <div class="result-card" id="resultCard">
        <div class="result-icon" id="resultIcon">✓</div>
        <div class="result-title" id="resultTitle">ผ่าน!</div>
        <div class="result-desc" id="resultDesc">ข้อนี้ตรวจผ่าน</div>
        
        <div class="comment-section" id="commentSection" style="display:none;">
          <label class="comment-label">เพิ่มคอมเมนต์ (ถ้าจำเป็น):</label>
          <textarea class="comment-textarea" id="commentTextarea" placeholder="เช่น: buzz เล็กน้อยที่เฟรต 12 สาย 7"></textarea>
          <div class="comment-count"><span id="commentLen">0</span>/200</div>
        </div>
        
        <button class="result-btn modal-next" id="nextBtn">ข้อถัดไป</button>
      </div>
    </div>

    <!-- Sub-checklist selection modal (for critical cards) -->
    <div class="modal-overlay" id="subCheckModal">
      <div class="result-card fail" style="max-width: 360px;">
        <div class="result-icon">🔍</div>
        <div class="result-title" style="color: var(--orange); font-size: 18px;">พบปัญหาข้อไหนบ้าง?</div>
        <div class="result-desc">เลือกจุดที่พบปัญหา (เลือกได้หลายข้อ)</div>
        <div class="sub-check-list" id="subCheckList"></div>
        <button class="result-btn modal-btn-restart" id="subCheckConfirmBtn">ยืนยัน</button>
      </div>
    </div>

    <!-- Deal-Breaker modal -->
    <div class="modal-overlay" id="dealBreakerModal">
      <div class="result-card fail" style="max-width: 360px;">
        <div class="result-icon">⚠️</div>
        <div class="result-title big-alert">แจ้งทีมงาน</div>
        <div class="result-desc">
          <b style="color: var(--text);">พบปัญหาที่ไม่ผ่านการตรวจ:</b>
        </div>
        <div id="criticalList" class="critical-list"></div>
        <div class="modal-buttons">
          <button class="result-btn modal-btn-continue" id="continueBtn">1. ดำเนินการต่อ</button>
          <button class="result-btn modal-btn-restart" id="restartBtn">2. เปลี่ยนตัวและเริ่มตรวจตัวใหม่</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <p id="completionStatus"></p>
    <button id="resetAllBtn" style="margin-top:16px;">ล้างข้อมูลทั้งหมด</button>
  </div>

</div>

<script>
const STORAGE_KEY = 'kx507ms-checklist-v3';

const DATA = [

        hint: "💡 ให้ร้าน Setup แก้จุดที่เป็น ⚠️ แล้วตรวจซ้ำก่อนเซ็นรับ" },

let state = {
  inspectorName: '',
  items: {},
  currentItem: 0,
  totalItems: 0,
  failedCritical: []
};

let allSections = [];
let currentSectionIdx = 0;
let currentItemInSectionIdx = 0;

function initData() {
  allSections = [];
  let itemCount = 0;
  
  DATA.forEach((sec, sIdx) => {
    allSections.push({
      section: sec.section,
      critical: sec.critical,
      items: sec.items.map((item, iIdx) => {
        itemCount++;
        const key = `${sIdx}-${iIdx}`;
        return { ...item, key, section: sec.section, critical: sec.critical };
      })
    });
  });
  
  state.totalItems = itemCount;
  loadState();
}

function getCurrentItem() {
  if (currentSectionIdx >= allSections.length) return null;
  const section = allSections[currentSectionIdx];
  if (currentItemInSectionIdx >= section.items.length) return null;
  return section.items[currentItemInSectionIdx];
}

function nextItem() {
  currentItemInSectionIdx++;
  if (currentItemInSectionIdx >= allSections[currentSectionIdx].items.length) {
    currentSectionIdx++;
    currentItemInSectionIdx = 0;
  }
}

function updateDisplay() {
  const item = getCurrentItem();
  if (!item) {
    document.getElementById('swipeCard').innerHTML = '<div style="text-align:center; padding:40px;"><div style="font-size:20px; color: var(--green); margin-bottom: 16px;">✓ ตรวจครบแล้ว!</div><div style="color: var(--muted);">ขอบคุณที่ใช้ checklist นี้</div></div>';
    return;
  }

  const itemData = state.items[item.key];
  
  document.getElementById('itemSection').textContent = item.section;
  document.getElementById('itemNumber').textContent = `ข้อที่ ${item.num}`;
  document.getElementById('itemText').textContent = item.text;
  document.getElementById('itemHint').textContent = item.hint;
  document.getElementById('itemBullets').innerHTML = (item.bullets || []).map(b => `<li>${b}</li>`).join('');
  
  const badge = document.getElementById('sectionBadge');
  if (item.critical) {
    badge.textContent = '🚩 จุดตรวจร้ายแรง';
    badge.classList.add('critical');
  } else {
    badge.textContent = item.section;
    badge.classList.remove('critical');
  }

  updateProgress();
}

function updateProgress() {
  let passed = 0;
  for (let key in state.items) {
    if (state.items[key].passed === true) passed++;
  }
  
  const pct = Math.round(passed / state.totalItems * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressCount').textContent = `${passed}/${state.totalItems}`;
  
  if (passed === state.totalItems) {
    document.getElementById('completionStatus').innerHTML = '<b style="color: var(--green);">✓ ตรวจครบแล้ว</b>';
  } else {
    document.getElementById('completionStatus').textContent = `ตรวจแล้ว ${passed}/${state.totalItems} การ์ด`;
  }
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      state.inspectorName = data.inspectorName || '';
      state.items = data.items || {};
      state.failedCritical = data.failedCritical || [];
    }
  } catch (e) {}
  
  document.getElementById('inspectorName').value = state.inspectorName;
  updateDisplay();
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {}
}

// Swipe interaction
const wrapper = document.getElementById('swipeWrapper');
const card = document.getElementById('swipeCard');
let touchStartX = 0;
let touchEndX = 0;
let isDragging = false;
let dragDistance = 0;

wrapper.addEventListener('pointerdown', (e) => {
  touchStartX = e.clientX;
  isDragging = true;
  dragDistance = 0;
  wrapper.classList.add('grabbing');
});

wrapper.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  touchEndX = e.clientX;
  dragDistance = touchEndX - touchStartX;
  
  card.style.transform = `translateX(${dragDistance * 0.8}px)`;
  
  if (dragDistance < -40) {
    wrapper.classList.add('swiping-right');
    wrapper.classList.remove('swiping-left');
  } else if (dragDistance > 40) {
    wrapper.classList.add('swiping-left');
    wrapper.classList.remove('swiping-right');
  } else {
    wrapper.classList.remove('swiping-left', 'swiping-right');
  }
});

wrapper.addEventListener('pointerup', () => {
  isDragging = false;
  wrapper.classList.remove('grabbing');
  
  const threshold = 80;
  const item = getCurrentItem();
  
  if (!item) return;
  
  if (dragDistance > threshold) {
    // Swipe left = PASS
    card.classList.add('swiped-left');
    recordResult(item, true);
  } else if (dragDistance < -threshold) {
    // Swipe right = FAIL
    card.classList.add('swiped-right');
    recordResult(item, false);
  } else {
    card.style.transform = 'translateX(0)';
    wrapper.classList.remove('swiping-left', 'swiping-right');
  }
});

wrapper.addEventListener('pointerleave', () => {
  if (isDragging) {
    isDragging = false;
    wrapper.classList.remove('grabbing');
    card.style.transform = 'translateX(0)';
    wrapper.classList.remove('swiping-left', 'swiping-right');
  }
});

function recordResult(item, passed) {
  state.items[item.key] = { passed, comment: '' };
  saveState();

  if (!passed && item.critical && item.subItems && item.subItems.length) {
    showSubCheckModal(item);
  } else if (!passed && item.critical) {
    state.failedCritical.push({ key: item.key, text: item.text, section: item.section, subIssues: [] });
    saveState();
    showDealBreakerModal();
  } else {
    showResultModal(passed, item);
  }
}

function showSubCheckModal(item) {
  const modal = document.getElementById('subCheckModal');
  const list = document.getElementById('subCheckList');

  list.innerHTML = item.subItems.map((sub, idx) => `
    <label class="sub-check-item">
      <input type="checkbox" data-sub="${idx}">
      <span>${sub}</span>
    </label>
  `).join('');

  document.getElementById('subCheckConfirmBtn').onclick = () => {
    const checked = Array.from(list.querySelectorAll('input:checked'))
      .map(cb => item.subItems[cb.dataset.sub]);

    state.failedCritical.push({
      key: item.key,
      text: item.text,
      section: item.section,
      subIssues: checked.length ? checked : [item.text]
    });
    saveState();

    modal.classList.remove('show');
    showDealBreakerModal();
  };

  modal.classList.add('show');
}

function showResultModal(passed, item) {
  const modal = document.getElementById('resultModal');
  const resultCard = document.getElementById('resultCard');
  const commentSection = document.getElementById('commentSection');
  const commentTextarea = document.getElementById('commentTextarea');
  
  if (passed) {
    resultCard.classList.add('pass');
    resultCard.classList.remove('fail');
    document.getElementById('resultIcon').textContent = '✓';
    document.getElementById('resultTitle').textContent = 'ผ่าน!';
    document.getElementById('resultDesc').textContent = 'ข้อนี้ตรวจผ่าน';
    commentSection.style.display = 'block';
  } else {
    resultCard.classList.add('fail');
    resultCard.classList.remove('pass');
    document.getElementById('resultIcon').textContent = '✗';
    document.getElementById('resultTitle').textContent = 'ไม่ผ่าน!';
    document.getElementById('resultDesc').textContent = 'พบปัญหา';
    commentSection.style.display = 'block';
  }
  
  commentTextarea.value = state.items[item.key].comment || '';
  commentTextarea.oninput = (e) => {
    state.items[item.key].comment = e.target.value;
    document.getElementById('commentLen').textContent = e.target.value.length;
    saveState();
  };
  document.getElementById('commentLen').textContent = (state.items[item.key].comment || '').length;
  
  modal.classList.add('show');
}

function showDealBreakerModal() {
  const modal = document.getElementById('dealBreakerModal');
  const list = document.getElementById('criticalList');
  
  const failedItems = state.failedCritical
    .map(f => {
      const subText = (f.subIssues && f.subIssues.length)
        ? f.subIssues.map(s => `<div class="critical-text">❌ ${s}</div>`).join('')
        : `<div class="critical-text">❌ ${f.text}</div>`;
      return `
        <div class="critical-item">
          ${subText}
          <div class="critical-section">${f.section} — ${f.text}</div>
        </div>
      `;
    }).join('');
  
  list.innerHTML = failedItems;
  modal.classList.add('show');
}

document.getElementById('nextBtn').addEventListener('click', () => {
  document.getElementById('resultModal').classList.remove('show');
  const item = getCurrentItem();
  
  if (item) {
    card.classList.remove('swiped-left', 'swiped-right');
    card.style.transform = 'translateX(0)';
    wrapper.classList.remove('swiping-left', 'swiping-right');
  }
  
  nextItem();
  updateDisplay();
});

document.getElementById('continueBtn').addEventListener('click', () => {
  document.getElementById('dealBreakerModal').classList.remove('show');
  const item = getCurrentItem();
  
  if (item) {
    card.classList.remove('swiped-left', 'swiped-right');
    card.style.transform = 'translateX(0)';
    wrapper.classList.remove('swiping-left', 'swiping-right');
  }
  
  nextItem();
  updateDisplay();
});

document.getElementById('restartBtn').addEventListener('click', () => {
  if (confirm('ล้างข้อมูลทั้งหมดและเริ่มตรวจตัวใหม่?')) {
    state = { inspectorName: state.inspectorName, items: {}, currentItem: 0, totalItems: state.totalItems, failedCritical: [] };
    currentSectionIdx = 0;
    currentItemInSectionIdx = 0;
    document.getElementById('dealBreakerModal').classList.remove('show');
    card.classList.remove('swiped-left', 'swiped-right');
    card.style.transform = 'translateX(0)';
    wrapper.classList.remove('swiping-left', 'swiping-right');
    saveState();
    updateDisplay();
  }
});

document.getElementById('inspectorName').addEventListener('input', (e) => {
  state.inspectorName = e.target.value;
  saveState();
});

document.getElementById('resetAllBtn').addEventListener('click', () => {
  if (confirm('ล้างข้อมูลทั้งหมด?')) {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
});

initData();
</script>
