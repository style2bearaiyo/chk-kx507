<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Checklist ตรวจรับกีตาร์ — Cort KX507MS Pale Moon</title>
<style>
  :root{
    --bg:#120B1A;
    --surface:#1C1226;
    --surface2:#251731;
    --border:#3B2450;
    --purple:#9A3FE0;
    --purple-deep:#6E2AA8;
    --purple-soft:#9A3FE026;
    --orange:#F0932B;
    --orange-soft:#F0932B26;
    --orange-deep:#C46A16;
    --red:#FF4757;
    --red-soft:#FF475726;
    --text:#F4EEFA;
    --muted:#A78FC4;
    --muted-dim:#7A628F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow-x:hidden; background:radial-gradient(circle at 50% -10%, #251531 0%, var(--bg) 60%);
    color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Top Bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(180deg,#1A1024 0%, #120B1A 100%);
    border-bottom:1px solid var(--border);
    padding:12px 16px 10px;
    box-shadow:0 4px 20px #00000066;
  }
  .topbar-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .topbar .eyebrow{ font-size:10px; letter-spacing:2px; color:var(--orange); font-weight:800; text-transform:uppercase; }
  
  .mode-toggle-btn{
    background:var(--surface2); border:1px solid var(--border); color:var(--purple);
    padding:5px 12px; border-radius:20px; font-size:11px; font-weight:700;
    cursor:pointer; display:flex; align-items:center; gap:5px; transition:all .2s;
  }
  .mode-toggle-btn:hover{ border-color:var(--purple); background:var(--purple-soft); }

  .progress-wrap{ display:flex; align-items:center; gap:10px; }
  .progress-track{
    flex:1; height:8px; border-radius:6px; background:var(--surface2);
    overflow:hidden; border:1px solid var(--border);
  }
  .progress-fill{
    height:100%; width:0%;
    background:linear-gradient(90deg, var(--purple-deep), var(--purple) 70%, var(--orange));
    transition:width .3s ease;
  }
  .progress-count{ font-size:11px; color:var(--orange); font-weight:800; white-space:nowrap; }

  .save-status{ font-size:10px; color:var(--muted-dim); margin-top:4px; display:flex; align-items:center; gap:5px; }
  .save-status .dot{ width:5px; height:5px; border-radius:50%; background:var(--muted-dim); transition:background .2s; }
  .save-status.saved .dot{ background:var(--purple); box-shadow:0 0 6px var(--purple); }

  /* ---------- Main View Containers ---------- */
  .container{ max-width:480px; margin:0 auto; padding:12px; display:flex; flex-direction:column; min-height:calc(100vh - 85px); }

  .inspector-card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:8px 12px; margin-bottom:12px; display:flex; align-items:center; gap:10px; flex-shrink:0;
  }
  .inspector-card label{ font-size:11px; color:var(--muted); font-weight:700; white-space:nowrap; }
  .inspector-card input{
    flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-size:13px; padding:6px 10px; outline:none;
  }
  .inspector-card input:focus{ border-color:var(--purple); }

  /* ---------- View Modes ---------- */
  .view-mode{ display:none; flex-direction:column; flex:1; }
  .view-mode.active{ display:flex; }

  /* ---------- Tinder Card Deck Container ---------- */
  .deck-container{
    flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;
    position:relative; min-height:420px; margin-bottom:15px;
  }
  .card-stack{
    width:100%; max-width:380px; height:390px; position:relative;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }

  /* Individual Tinder Card */
  .tinder-card{
    position:absolute; width:100%; height:100%; border-radius:20px;
    background:var(--surface); border:1.5px solid var(--border);
    box-shadow:0 12px 30px #00000088; padding:20px;
    display:flex; flex-direction:column; justify-content:space-between;
    cursor:grab; will-change:transform; transition:transform 0.2s ease, opacity 0.2s ease;
  }
  .tinder-card:active{ cursor:grabbing; }
  
  /* Stack Depth Effect */
  .tinder-card.card-next{ transform:scale(0.94) translateY(16px); z-index:1; opacity:0.8; pointer-events:none; }
  .tinder-card.card-next-2{ transform:scale(0.88) translateY(32px); z-index:0; opacity:0.4; pointer-events:none; }
  .tinder-card.card-top{ z-index:2; }

  .card-tag{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11px; font-weight:800; padding:4px 10px; border-radius:12px;
    background:var(--surface2); border:1px solid var(--border); color:var(--purple);
    align-self:flex-start; margin-bottom:10px;
  }
  .card-tag.critical{ color:var(--orange); border-color:var(--orange-soft); background:var(--orange-soft); }

  .card-body{ flex:1; display:flex; flex-direction:column; justify-content:center; }
  .card-item-title{ font-size:18px; font-weight:800; line-height:1.4; color:var(--text); margin-bottom:12px; }
  .card-howto{
    font-size:12.5px; color:var(--muted); background:var(--surface2);
    padding:10px 12px; border-radius:10px; border-left:3px solid var(--purple); line-height:1.5;
  }
  .card-tag.critical + .card-body .card-howto{ border-left-color:var(--orange); }

  .card-comment-wrap{ margin-top:10px; }
  .card-comment-input{
    width:100%; background:var(--surface2); border:1px solid var(--border);
    border-radius:8px; color:var(--text); font-size:12px; padding:8px;
    resize:none; height:45px; font-family:inherit; outline:none;
  }
  .card-comment-input:focus{ border-color:var(--purple); }

  .card-footer-info{
    display:flex; justify-content:space-between; align-items:center;
    font-size:10.5px; color:var(--muted-dim); margin-top:8px;
  }

  /* Stamp Overlay */
  .stamp{
    position:absolute; top:25px; padding:6px 16px; border-radius:8px;
    font-size:22px; font-weight:900; letter-spacing:2px; text-transform:uppercase;
    opacity:0; pointer-events:none; transition:opacity 0.1s ease; z-index:10;
  }
  .stamp-pass{ right:20px; color:var(--purple); border:3px solid var(--purple); transform:rotate(12deg); }
  .stamp-fail{ left:20px; color:var(--orange); border:3px solid var(--orange); transform:rotate(-12deg); }

  /* ---------- Action Buttons Bar ---------- */
  .action-bar{
    display:flex; justify-content:center; align-items:center; gap:16px;
    padding:10px 0; margin-top:auto;
  }
  .btn-action{
    border:none; border-radius:50%; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow:0 6px 16px #00000055;
  }
  .btn-action:active{ transform:scale(0.88); }
  
  .btn-undo{ width:44px; height:44px; background:var(--surface2); border:1px solid var(--border); color:var(--muted); font-size:18px; }
  .btn-fail{ width:60px; height:60px; background:var(--surface); border:2px solid var(--orange); color:var(--orange); font-size:26px; }
  .btn-pass{ width:60px; height:60px; background:var(--surface); border:2px solid var(--purple); color:var(--purple); font-size:26px; }
  .btn-comment-toggle{ width:44px; height:44px; background:var(--surface2); border:1px solid var(--border); color:var(--text); font-size:18px; }

  /* ---------- List View Accordion ---------- */
  .list-container{ display:flex; flex-direction:column; gap:8px; padding-bottom:20px; }
  .section{ background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .section.critical{ border-color:var(--orange-deep); }
  .section-head{ padding:12px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .section-title{ font-size:14px; font-weight:700; }
  .section-body{ max-height:0; overflow:hidden; transition:max-height .3s ease; }
  .section.open .section-body{ border-top:1px solid var(--border); }
  .list-item{ padding:10px 12px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .list-item-text{ font-size:13px; flex:1; }
  .list-item-status{ font-size:11px; font-weight:800; padding:3px 8px; border-radius:6px; }
  .status-pass{ background:var(--purple-soft); color:var(--purple); }
  .status-fail{ background:var(--orange-soft); color:var(--orange); }
  .status-none{ color:var(--muted-dim); }

  /* ---------- Deal-breaker Modal ---------- */
  .modal-overlay{
    display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    z-index:100; overflow-y:auto; background:rgba(10, 5, 18, 0.9); backdrop-filter:blur(6px);
    align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-content{
    background:var(--surface); border:2px solid var(--orange);
    border-radius:20px; padding:24px 20px; max-width:420px; width:100%; text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.8); animation:modalPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes modalPop {
    0% { transform:scale(0.85); opacity:0; }
    100% { transform:scale(1); opacity:1; }
  }

  .modal-alert-badge{
    display:inline-block; background:var(--orange-soft); border:1px solid var(--orange);
    color:var(--orange); font-size:11px; font-weight:800; padding:4px 12px; border-radius:20px;
    letter-spacing:1px; margin-bottom:10px; text-transform:uppercase;
  }
  .modal-title-big{
    font-size:34px; font-weight:900; color:var(--orange);
    margin:0 0 12px 0; text-shadow:0 0 15px rgba(240, 147, 43, 0.3);
    line-height:1.1;
  }
  .failed-item-box{
    background:var(--surface2); border:1.5px solid var(--orange); border-radius:12px;
    padding:14px; margin:14px 0 20px; text-align:left;
  }
  .failed-item-label{ font-size:11px; color:var(--muted); font-weight:700; margin-bottom:4px; }
  .failed-item-title{ font-size:15px; font-weight:800; color:var(--text); line-height:1.4; }

  .modal-actions{ display:flex; flex-direction:column; gap:10px; }
  .modal-btn{
    width:100%; border:none; font-weight:800; padding:13px; border-radius:12px;
    cursor:pointer; font-size:13.5px; transition:transform 0.1s ease, filter 0.15s ease;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .modal-btn:active{ transform:scale(0.98); }
  .modal-btn-continue{ background:var(--surface2); border:1px solid var(--border); color:var(--text); }
  .modal-btn-continue:hover{ background:var(--border); }
  .modal-btn-restart{ background:linear-gradient(135deg, var(--orange), var(--orange-deep)); color:#fff; box-shadow:0 4px 15px rgba(240, 147, 43, 0.4); }

  /* Summary Card */
  .final-card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:14px; text-align:center; margin-top:10px;
  }
  .final-card .big{ font-size:26px; font-weight:800; color:var(--orange); }
  .reset-link{ background:none; border:none; color:var(--muted-dim); font-size:11px; text-decoration:underline; cursor:pointer; margin-top:10px; width:100%; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-header">
    <div class="eyebrow">Cort KX507MS Checklist</div>
    <button class="mode-toggle-btn" id="modeToggleBtn">📋 ดูทุกข้อ (List)</button>
  </div>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-count" id="progressCount">0/0</div>
  </div>
  <div class="save-status" id="saveStatus"><span class="dot"></span><span id="saveStatusText">พร้อมบันทึก</span></div>
</div>

<div class="container">

  <div class="inspector-card">
    <label for="inspectorName">ผู้ตรวจ</label>
    <input type="text" id="inspectorName" placeholder="ระบุชื่อผู้ตรวจ...">
  </div>

  <!-- TINDER CARD DECK VIEW -->
  <div id="deckView" class="view-mode active">
    <div class="deck-container">
      <div class="card-stack" id="cardStack">
        <!-- Cards injected dynamically via JS -->
      </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="action-bar">
      <button class="btn-action btn-undo" id="btnUndo" title="ย้อนกลับ">↺</button>
      <button class="btn-action btn-fail" id="btnFail" title="ไม่ผ่าน (ปัดขวา)">✗</button>
      <button class="btn-action btn-comment-toggle" id="btnComment" title="ใส่คอมเมนต์">💬</button>
      <button class="btn-action btn-pass" id="btnPass" title="ผ่าน (ปัดซ้าย)">✓</button>
    </div>
  </div>

  <!-- LIST OVERVIEW VIEW -->
  <div id="listView" class="view-mode">
    <div class="list-container" id="listContainer">
      <!-- List sections injected dynamically -->
    </div>
  </div>

  <div class="final-card">
    <div class="big" id="finalScore">0%</div>
    <div style="font-size:12px; color:var(--muted);" id="finalVerdict">เริ่มตรวจจากข้อแรก...</div>
  </div>

  <button class="reset-link" id="resetBtn" type="button">ล้างข้อมูลทั้งหมดแล้วเริ่มใหม่</button>

</div>

<!-- DEAL BREAKER POPUP MODAL -->
<div class="modal-overlay" id="dealBreakerModal">
  <div class="modal-content">
    <div class="modal-alert-badge">⚠️ พบปัญหาร้ายแรง (Deal-Breaker)</div>
    <div class="modal-title-big">แจ้งทีมงาน</div>
    
    <div class="failed-item-box">
      <div class="failed-item-label">หัวข้อที่ไม่ผ่านการตรวจ:</div>
      <div class="failed-item-title" id="dealBreakerText">-</div>
    </div>

    <div class="modal-actions">
      <button class="modal-btn modal-btn-continue" id="btnContinue">1. ดำเนินการต่อ</button>
      <button class="modal-btn modal-btn-restart" id="btnRestart">2. เปลี่ยนตัวและเริ่มตรวจตัวใหม่</button>
    </div>
  </div>
</div>

// Flatten DATA into a linear queue
let ALL_ITEMS = [];
DATA.forEach((sec, sIdx) => {
  sec.items.forEach((itemText, iIdx) => {
    ALL_ITEMS.push({
      key: `s${sIdx}-i${iIdx}`,
      secIdx: sIdx,
      itemIdx: iIdx,
      secTitle: sec.title,
      critical: sec.critical || false,
      howto: sec.howto,
      text: itemText
    });
  });
});

const STORAGE_KEY = 'kx507ms-checklist-tinder-state';
let state = { inspectorName: '', items: {}, currIndex: 0, history: [] };

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      state = Object.assign(state, JSON.parse(raw));
    }
  } catch(e) {}
}

function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    document.getElementById('saveStatus').classList.add('saved');
  } catch(e) {}
}

// Global UI State
let currentIndex = 0;
let isListView = false;

function init(){
  loadState();
  currentIndex = state.currIndex || 0;
  
  document.getElementById('inspectorName').value = state.inspectorName || '';
  document.getElementById('inspectorName').addEventListener('input', (e) => {
    state.inspectorName = e.target.value;
    saveState();
  });

  renderDeck();
  renderList();
  updateProgress();

  // Control Buttons
  document.getElementById('btnPass').addEventListener('click', () => swipeCard('left'));
  document.getElementById('btnFail').addEventListener('click', () => swipeCard('right'));
  document.getElementById('btnUndo').addEventListener('click', undoSwipe);
  document.getElementById('btnComment').addEventListener('click', toggleCommentFocus);

  // View Mode Toggle
  document.getElementById('modeToggleBtn').addEventListener('click', () => {
    isListView = !isListView;
    document.getElementById('deckView').classList.toggle('active', !isListView);
    document.getElementById('listView').classList.toggle('active', isListView);
    document.getElementById('modeToggleBtn').textContent = isListView ? "🃏 โหมด Tinder Card" : "📋 ดูทุกข้อ (List)";
  });

  // Modal Actions
  document.getElementById('btnContinue').addEventListener('click', () => {
    document.getElementById('dealBreakerModal').classList.remove('open');
  });

  document.getElementById('btnRestart').addEventListener('click', () => {
    if(confirm('ยืนยันล้างข้อมูลและเริ่มตรวจตัวใหม่ตั้งแต่ข้อแรก?')){
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if(confirm('ล้างข้อมูลทั้งหมดแล้วเริ่มตรวจใหม่?')){
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }
  });
}

function renderDeck(){
  const stack = document.getElementById('cardStack');
  stack.innerHTML = '';

  if (currentIndex >= ALL_ITEMS.length) {
    stack.innerHTML = `<div style="text-align:center; padding:40px; color:var(--muted);">🎉 ตรวจครบทุกข้อแล้ว! คุณสามารถดูสรุปผลด้านล่าง หรือสลับไปโหมด List ได้</div>`;
    return;
  }

  // Render Top 3 Cards for Stack Performance
  for (let i = 0; i < 3; i++) {
    const idx = currentIndex + i;
    if (idx >= ALL_ITEMS.length) break;

    const item = ALL_ITEMS[idx];
    const card = document.createElement('div');
    card.className = `tinder-card ${i === 0 ? 'card-top' : i === 1 ? 'card-next' : 'card-next-2'}`;
    card.dataset.index = idx;

    const savedState = state.items[item.key] || {};

    card.innerHTML = `
      <div class="stamp stamp-pass">PASS ✓</div>
      <div class="stamp stamp-fail">FAIL ✗</div>
      <div>
        <div class="card-tag ${item.critical ? 'critical' : ''}">
          ${item.critical ? '🚩' : '📌'} หมวด ${item.secIdx + 1}/${DATA.length} • ${item.secTitle}
        </div>
        <div class="card-body">
          <div class="card-item-title">${item.text}</div>
          <div class="card-howto">💡 <b>วิธีตรวจ:</b> ${item.howto}</div>
        </div>
      </div>
      <div class="card-comment-wrap">
        <textarea class="card-comment-input" placeholder="💬 เพิ่มบันทึก/คอมเมนต์ข้อนี้..." data-key="${item.key}">${savedState.comment || ''}</textarea>
      </div>
      <div class="card-footer-info">
        <span>ข้อที่ ${idx + 1} จาก ${ALL_ITEMS.length}</span>
        <span>👈 ปัดซ้าย: ผ่าน | ปัดขวา: ไม่ผ่าน 👉</span>
      </div>
    `;

    // Comment saving
    const commentInput = card.querySelector('.card-comment-input');
    commentInput.addEventListener('input', (e) => {
      state.items[item.key] = state.items[item.key] || {};
      state.items[item.key].comment = e.target.value;
      saveState();
    });

    stack.appendChild(card);

    if (i === 0) attachDragEvents(card, item);
  }
}

// Drag / Touch Gesture Engine
function attachDragEvents(card, item){
  let startX = 0, startY = 0, currentX = 0, currentY = 0;
  let isDragging = false;
  const stampPass = card.querySelector('.stamp-pass');
  const stampFail = card.querySelector('.stamp-fail');

  function onPointerDown(e){
    if(e.target.tagName === 'TEXTAREA') return; // let user interact with comment box
    isDragging = true;
    startX = e.clientX || (e.touches && e.touches[0].clientX);
    startY = e.clientY || (e.touches && e.touches[0].clientY);
    card.style.transition = 'none';
  }

  function onPointerMove(e){
    if (!isDragging) return;
    const x = e.clientX || (e.touches && e.touches[0].clientX);
    const y = e.clientY || (e.touches && e.touches[0].clientY);
    currentX = x - startX;
    currentY = y - startY;

    const rotate = currentX * 0.08;
    card.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) rotate(${rotate}deg)`;

    // Stamp opacity
    if (currentX < -30) {
      stampPass.style.opacity = Math.min(1, Math.abs(currentX) / 80);
      stampFail.style.opacity = 0;
    } else if (currentX > 30) {
      stampFail.style.opacity = Math.min(1, Math.abs(currentX) / 80);
      stampPass.style.opacity = 0;
    } else {
      stampPass.style.opacity = 0;
      stampFail.style.opacity = 0;
    }
  }

  function onPointerUp(){
    if (!isDragging) return;
    isDragging = false;
    card.style.transition = 'transform 0.25s ease, opacity 0.25s ease';

    const threshold = 90;
    if (currentX < -threshold) {
      swipeCard('left');
    } else if (currentX > threshold) {
      swipeCard('right');
    } else {
      card.style.transform = `translate3d(0, 0, 0) rotate(0deg)`;
      stampPass.style.opacity = 0;
      stampFail.style.opacity = 0;
    }
  }

  card.addEventListener('mousedown', onPointerDown);
  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);

  card.addEventListener('touchstart', onPointerDown, {passive: true});
  window.addEventListener('touchmove', onPointerMove, {passive: true});
  window.addEventListener('touchend', onPointerUp);
}

function swipeCard(direction){
  if (currentIndex >= ALL_ITEMS.length) return;

  const item = ALL_ITEMS[currentIndex];
  const card = document.querySelector('.tinder-card.card-top');
  const status = direction === 'left' ? 'pass' : 'fail';

  if (card) {
    const moveX = direction === 'left' ? -500 : 500;
    card.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
    card.style.transform = `translate3d(${moveX}px, 0, 0) rotate(${direction === 'left' ? -20 : 20}deg)`;
    card.style.opacity = 0;
  }

  // Save history for undo
  state.history.push({ index: currentIndex, itemKey: item.key, prevStatus: state.items[item.key]?.status });

  // Update State
  state.items[item.key] = state.items[item.key] || {};
  state.items[item.key].status = status;
  currentIndex++;
  state.currIndex = currentIndex;
  saveState();

  // Show Pop-up if Deal-Breaker Item Fails
  if (status === 'fail' && item.critical) {
    document.getElementById('dealBreakerText').textContent = `${item.secTitle}: ${item.text}`;
    document.getElementById('dealBreakerModal').classList.add('open');
  }

  setTimeout(() => {
    renderDeck();
    renderList();
    updateProgress();
  }, 200);
}

function undoSwipe(){
  if (state.history.length === 0) return;
  const last = state.history.pop();
  currentIndex = last.index;
  state.currIndex = currentIndex;
  saveState();

  renderDeck();
  renderList();
  updateProgress();
}

function toggleCommentFocus(){
  const input = document.querySelector('.tinder-card.card-top .card-comment-input');
  if (input) input.focus();
}

function renderList(){
  const container = document.getElementById('listContainer');
  container.innerHTML = '';

  DATA.forEach((sec, sIdx) => {
    const secEl = document.createElement('div');
    secEl.className = `section ${sec.critical ? 'critical' : ''}`;

    let itemsHtml = '';
    sec.items.forEach((itemText, iIdx) => {
      const key = `s${sIdx}-i${iIdx}`;
      const status = state.items[key]?.status;
      const statusClass = status === 'pass' ? 'status-pass' : status === 'fail' ? 'status-fail' : 'status-none';
      const statusText = status === 'pass' ? '✓ ผ่าน' : status === 'fail' ? '✗ ไม่ผ่าน' : 'ยังไม่ตรวจ';

      itemsHtml += `
        <div class="list-item">
          <span class="list-item-text">${itemText}</span>
          <span class="list-item-status ${statusClass}">${statusText}</span>
        </div>
      `;
    });

    secEl.innerHTML = `
      <div class="section-head">
        <span class="section-title">${sec.critical ? '🚩' : '📌'} ${sec.title}</span>
        <span style="font-size:12px; color:var(--muted);">▼</span>
      </div>
      <div class="section-body">
        ${itemsHtml}
      </div>
    `;

    secEl.querySelector('.section-head').addEventListener('click', () => {
      secEl.classList.toggle('open');
      const body = secEl.querySelector('.section-body');
      body.style.maxHeight = secEl.classList.contains('open') ? body.scrollHeight + 'px' : null;
    });

    container.appendChild(secEl);
  });
}

function updateProgress(){
  const total = ALL_ITEMS.length;
  const doneKeys = Object.keys(state.items).filter(k => state.items[k].status);
  const donePass = doneKeys.filter(k => state.items[k].status === 'pass').length;
  const doneFail = doneKeys.filter(k => state.items[k].status === 'fail').length;

  const pct = Math.round((doneKeys.length / total) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressCount').textContent = `${doneKeys.length}/${total}`;
  document.getElementById('finalScore').textContent = `${pct}%`;

  const verdict = document.getElementById('finalVerdict');
  if (doneFail > 0) {
    verdict.textContent = `⚠️ พบข้อไม่ผ่าน ${doneFail} ข้อ (ผ่านแล้ว ${donePass} ข้อ)`;
    verdict.style.color = 'var(--orange)';
  } else if (doneKeys.length === total) {
    verdict.textContent = '✅ ตรวจครบทุกข้อแล้ว — ผ่านหมด!';
    verdict.style.color = 'var(--purple)';
  } else {
    verdict.textContent = `ตรวจแล้ว ${doneKeys.length} จาก ${total} ข้อ`;
    verdict.style.color = 'var(--muted)';
  }
}
